<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | Vitta Café</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">
    <h1>☕ Vitta Café</h1>
    <p>Controle de Pedidos</p>
</header>

<main class="container">

    <a href="../index.html" class="voltar">← Voltar para o início</a>

    <section class="formulario">

        <h2>Novo Pedido</h2>

        <form id="formPedido">

            <label>Cliente:</label>
            <input
                type="text"
                id="clientePedido"
                required
            >

            <label>Produto:</label>

            <select id="produtoPedido" required>
                <option value="">
                    Selecione um produto
                </option>
            </select>

            <label>Quantidade:</label>

            <input
                type="number"
                id="quantidadePedido"
                min="1"
                required
            >

            <button type="submit">
                Realizar Pedido
            </button>

        </form>

        <div id="resultadoPedido"></div>

    </section>

    <section>

        <h2>Pedidos realizados</h2>

        <div id="listaPedidos" class="lista"></div>

    </section>

</main>

<script src="../js/pedidos.js"></script>

</body>
</html>
