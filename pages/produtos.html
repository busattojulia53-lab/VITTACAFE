<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | Vitta Café</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header">
    <h1>☕ Vitta Café</h1>
    <p>Cadastro de Produtos</p>
</header>

<main class="container">

    <a href="../index.html" class="voltar">← Voltar para o início</a>

    <section class="formulario">

        <h2>Cadastrar Produto</h2>

        <form id="formProduto">

            <label>Nome do produto:</label>
            <input type="text" id="nomeProduto" required>

            <label>Preço:</label>
            <input type="number" id="precoProduto" step="0.01" min="0" required>

            <label>Quantidade em estoque:</label>
            <input type="number" id="estoqueProduto" min="0" required>

            <button type="submit">Cadastrar Produto</button>

        </form>

    </section>

    <section>
        <h2>Produtos cadastrados</h2>

        <div id="listaProdutos" class="lista"></div>
    </section>

</main>

<script src="../js/produtos.js"></script>

</body>
</html>
